            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-100 via-slate-100 to-slate-100 fade-in">
                <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-t-4 border-blue-600">
                    <button onclick="navigate('home')" class="mb-6 flex items-center text-sm text-slate-500 hover:text-blue-600 transition-colors">
                        <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Kembali
                    </button>
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-slate-800">Identitas Murid</h2>
                        <p class="text-slate-500 mt-1">Pilih nama Anda untuk memulai asesmen.</p>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
                            <input type="text" value="${CLASS_NAME}" disabled class="w-full p-3 border border-slate-200 rounded-lg bg-slate-100 text-slate-600 cursor-not-allowed font-medium" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Murid</label>
                            <select id="student-name-select" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white cursor-pointer shadow-sm">
                                <option value="" disabled selected>-- Pilih Nama Anda --</option>
                                ${options}
                            </select>
                        </div>
                        
                        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mt-6">
                            <h4 class="text-sm font-bold text-yellow-800 flex items-center gap-2 mb-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Perhatian</h4>
                            <ul class="text-xs text-yellow-700 space-y-1 list-disc pl-4">
                                <li>Waktu ujian adalah 25 menit.</li>
                                <li>Ujian hanya dapat dilakukan 1 kali.</li>

                            </ul>
                        </div>

                        <button onclick="handleStudentStart()" id="btn-start-exam" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 mt-6 shadow-md hover:shadow-lg">
                            MULAI ASESMEN
                        </button>
                    </div>
                </div>
            </div>
            `;
        };

        const handleStudentStart = () => {
            const select = document.getElementById('student-name-select');
            const selectedName = select.value;
            
            if (!selectedName) {
                showModal("Perhatian", "Silakan pilih nama Anda terlebih dahulu.", null, "Tutup", null, null, "warning");
                return;
            }

            const btn = document.getElementById('btn-start-exam');
            btn.innerHTML = 'Memproses...';
            btn.disabled = true;

            const session = DB.getSession(selectedName);

            if (session) {
                if (session.status === 'completed') {
                    showModal("Ujian Selesai", "Kesempatan ujian Anda telah digunakan. Anda tidak dapat mengikuti ujian lagi.", () => {
                        AppState.currentUser = { role: 'student', name: selectedName };
                        navigate('student_dash');
                    }, "Lihat Hasil");
                    return;
                } else if (session.status === 'in_progress') {
                    showModal("Sesi Ditemukan", "Anda memiliki sesi ujian yang terputus. Sesi akan dipulihkan beserta sisa waktu Anda.", () => {
                        AppState.currentUser = { role: 'student', name: selectedName };
                        navigate('exam');
                    }, "Lanjutkan Ujian");
                    return;
                }
            }

            // Inisialisasi sesi baru
            const qOrder = shuffleArray(QUESTION_BANK.map(q => q.id));
            const oOrders = {};
            QUESTION_BANK.forEach(q => {
                oOrders[q.id] = shuffleArray(q.opts.map(o => o.id));
            });

            DB.setSession(selectedName, {
                name: selectedName,
                status: 'in_progress',
                startTime: Date.now(),
                answers: {},
                questionOrder: qOrder,
                optionOrders: oOrders,
                tabSwitches: 0
            });

            AppState.currentUser = { role: 'student', name: selectedName };
            navigate('exam');
        };

        const renderExam = () => {
            return `
            <div class="min-h-screen bg-slate-100 flex flex-col font-sans fade-in">
                <!-- Header -->
                <header class="bg-white shadow-sm sticky top-0 z-30 px-4 py-3 flex justify-between items-center border-b border-slate-200">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-600 text-white p-2 rounded-lg hidden sm:block"><i data-lucide="calculator" class="w-5 h-5"></i></div>
                        <div>
                            <h1 class="font-bold text-slate-800 leading-tight">Asesmen Matematika</h1>
                            <p class="text-xs text-slate-500 font-medium">${AppState.currentUser.name} • ${CLASS_NAME}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div id="timer-display" class="flex items-center gap-2 font-mono font-bold text-lg px-4 py-1.5 rounded-full bg-slate-100 text-slate-700">
                            <i data-lucide="clock" class="w-5 h-5"></i> <span>25:00</span>
                        </div>
                        <button onclick="toggleGrid()" class="sm:hidden p-2 bg-slate-100 rounded-lg text-slate-600">
                            <i data-lucide="layout-grid" class="w-5 h-5"></i>
                        </button>
                    </div>
                </header>

                <div class="flex-1 flex overflow-hidden relative">
                    <!-- Sidebar Navigasi Soal -->
                    <aside id="exam-sidebar" class="absolute sm:relative z-20 bg-white border-r border-slate-200 w-64 h-full transform -translate-x-full sm:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-xl sm:shadow-none">
                        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="font-bold text-slate-700 text-sm">Navigasi Soal</h3>
                            <button onclick="toggleGrid()" class="sm:hidden text-slate-400 hover:text-slate-600"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 hide-scroll">
                            <div id="nav-grid" class="grid grid-cols-5 gap-2"></div>
                        </div>
                        <div class="p-4 border-t border-slate-100 bg-slate-50">
                            <div class="flex items-center gap-2 text-xs text-slate-600 mb-4 justify-center">
                                <span class="w-3 h-3 bg-blue-600 rounded-sm inline-block"></span> Dijawab
                                <span class="w-3 h-3 bg-yellow-400 rounded-sm inline-block ml-2"></span> Ragu
                            </div>
                            <button onclick="confirmSubmit()" class="w-full bg-emerald-500 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-600 transition-colors shadow-sm flex items-center justify-center gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4"></i> Kumpulkan Ujian
                            </button>
                        </div>
                    </aside>

                    <!-- Area Utama Soal -->
                    <main class="flex-1 overflow-y-auto p-4 sm:p-8 flex justify-center">
                        <div class="max-w-3xl w-full">
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <span id="question-counter" class="font-bold text-slate-500 text-sm tracking-wider uppercase">Soal No. 1 dari 35</span>
                                    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                                        <label class="flex items-center gap-2 text-sm font-medium text-slate-600 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
                                            <input type="checkbox" id="mark-doubt" onchange="toggleDoubt()" class="w-4 h-4 text-yellow-500 rounded focus:ring-yellow-500 cursor-pointer" />
                                            Tandai Ragu-ragu
                                        </label>
                                        <span class="hidden sm:inline-block text-xs font-semibold px-2 py-1 bg-blue-100 text-blue-700 rounded-md">Pilihan Ganda</span>
                                    </div>
                                </div>
                                <div class="p-6 sm:p-10">
                                    <h2 id="question-text" class="text-xl sm:text-2xl font-medium text-slate-800 leading-relaxed mb-8"></h2>
                                    <div id="options-container" class="space-y-3"></div>
                                </div>
                            </div>

                            <!-- Kontrol Navigasi Bawah -->
                            <div class="mt-6 flex justify-between items-center">
                                <button onclick="changeQuestion(-1)" id="btn-prev" class="px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 text-slate-600 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed transition-colors bg-white border border-slate-200 shadow-sm">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Sebelumnya
                                </button>
                                
                                <button onclick="changeQuestion(1)" id="btn-next" class="px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm">
                                    Berikutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
                <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-10 hidden" onclick="toggleGrid()"></div>
            </div>
            `;
        };

        const attachExamListeners = () => {
            AppState.examIndex = 0;
            AppState.reviewMarks = AppState.reviewMarks || {};
            AppState.hasWarned5 = false;
            AppState.hasWarned1 = false;
            
            // Tab Switch detection (Anti-cheat)
            document.onvisibilitychange = () => {
                if (document.hidden && AppState.view === 'exam') {
                    const sess = DB.getSession(AppState.currentUser.name);
                    if (sess && sess.status === 'in_progress') {
                        DB.updateSession(AppState.currentUser.name, { tabSwitches: (sess.tabSwitches || 0) + 1 });
                    }
                }
            };

            startTimer();
            updateExamUI();
        };

        const startTimer = () => {
            if(AppState.timerInterval) clearInterval(AppState.timerInterval);
            
            AppState.timerInterval = setInterval(() => {
                if(AppState.view !== 'exam') {
                    clearInterval(AppState.timerInterval);
                    return;
                }

                const sess = DB.getSession(AppState.currentUser.name);
                if(!sess || sess.status !== 'in_progress') return;

                const elapsed = Math.floor((Date.now() - sess.startTime) / 1000);
                const remaining = Math.max(0, EXAM_DURATION_SEC - elapsed);
                AppState.timeLeft = remaining;

                const tDisplay = document.getElementById('timer-display');
                if(tDisplay) {
                    tDisplay.querySelector('span').innerText = formatTime(remaining);
                    if(remaining <= 300) {
                        tDisplay.className = "flex items-center gap-2 font-mono font-bold text-lg px-4 py-1.5 rounded-full bg-red-100 text-red-700 animate-pulse";
                    }
                }

                if(remaining <= 300 && remaining > 0 && !AppState.hasWarned5) {
                    AppState.hasWarned5 = true;
                    showModal("Peringatan Waktu", "Waktu ujian tersisa 5 menit lagi. Silakan periksa kembali jawaban Anda.", null, "Mengerti", null, null, "warning");
                }
                
                if(remaining <= 60 && remaining > 0 && !AppState.hasWarned1) {
                    AppState.hasWarned1 = true;
                    showModal("Peringatan Waktu", "Waktu ujian tersisa 1 menit! Ujian akan otomatis dikumpulkan saat waktu habis.", null, "Mengerti", null, null, "warning");
                }

                if(remaining <= 0) {
                    clearInterval(AppState.timerInterval);
                    handleAutoSubmit();
                }
            }, 1000);
        };

        const toggleGrid = () => {
            const sidebar = document.getElementById('exam-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        const updateExamUI = () => {
            const sess = DB.getSession(AppState.currentUser.name);
            if(!sess) return;

            const idx = AppState.examIndex;
            const qId = sess.questionOrder[idx];
            const qDef = QUESTION_BANK.find(q => q.id === qId);
            const oIds = sess.optionOrders[qId];
            const currentAnswer = sess.answers[qId];

            document.getElementById('question-counter').innerText = `Soal No. ${idx + 1} dari 35`;
            document.getElementById('question-text').innerText = qDef.text;
            
            // Render Options
            const labels = ['A', 'B', 'C', 'D'];
            const optsHtml = oIds.map((optId, oIdx) => {
                const optDef = qDef.opts.find(o => o.id === optId);
                const isSelected = currentAnswer === optId;
                
                let btnClass = isSelected 
                    ? 'border-blue-500 bg-blue-50/50' 
                    : 'border-slate-200 hover:border-blue-300 hover:bg-slate-50';
                
                let labelClass = isSelected 
                    ? 'bg-blue-500 text-white' 
                    : 'bg-slate-100 text-slate-500 group-hover:bg-blue-100 group-hover:text-blue-600';
                
                let textClass = isSelected ? 'text-blue-900' : 'text-slate-700';

                return `
                    <button onclick="handleAnswer('${qId}', '${optId}')" class="w-full text-left p-4 rounded-xl border-2 transition-all flex items-center group ${btnClass}">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold mr-4 shrink-0 transition-colors ${labelClass}">
                            ${labels[oIdx]}
                        </div>
                        <span class="text-lg font-medium ${textClass}">${optDef.t}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('options-container').innerHTML = optsHtml;

            // Update Nav Grid
            const navGridHtml = sess.questionOrder.map((qid, i) => {
                const isAnswered = !!sess.answers[qid];
                const isActive = i === idx;
                const isMarked = AppState.reviewMarks[qid];
                
                let cls = 'bg-slate-100 text-slate-500 hover:bg-slate-200';
                if(isMarked) cls = 'bg-yellow-400 text-yellow-900';
                else if(isAnswered) cls = 'bg-blue-600 text-white';
                
                if(isActive) cls += ' ring-2 ring-blue-600 ring-offset-1';

                return `<button onclick="jumpToQuestion(${i})" class="w-10 h-10 rounded-lg text-sm font-bold flex items-center justify-center transition-all ${cls}">${i + 1}</button>`;
            }).join('');
            document.getElementById('nav-grid').innerHTML = navGridHtml;

            // Doubt Checkbox
            document.getElementById('mark-doubt').checked = !!AppState.reviewMarks[qId];

            // Buttons
            document.getElementById('btn-prev').disabled = (idx === 0);
            
            const btnNext = document.getElementById('btn-next');
            if(idx === 34) {
                btnNext.innerHTML = `Selesai <i data-lucide="check-circle" class="w-4 h-4"></i>`;
                btnNext.className = "px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 text-white bg-emerald-500 hover:bg-emerald-600 transition-colors shadow-sm";
                btnNext.onclick = confirmSubmit;
            } else {
                btnNext.innerHTML = `Berikutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>`;
                btnNext.className = "px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm";
                btnNext.onclick = () => changeQuestion(1);
            }
            lucide.createIcons();
        };

        const handleAnswer = (qId, optId) => {
            const sess = DB.getSession(AppState.currentUser.name);
            if(!sess || sess.status !== 'in_progress') return;
            sess.answers[qId] = optId;
            DB.setSession(AppState.currentUser.name, sess);
            updateExamUI();
        };

        const changeQuestion = (dir) => {
            const newIdx = AppState.examIndex + dir;
            if(newIdx >= 0 && newIdx < 35) {
                AppState.examIndex = newIdx;
                updateExamUI();
            }
        };

        const jumpToQuestion = (idx) => {
            AppState.examIndex = idx;
            updateExamUI();
            if(window.innerWidth < 640) toggleGrid();
        };

        const toggleDoubt = () => {
            const sess = DB.getSession(AppState.currentUser.name);
            const qId = sess.questionOrder[AppState.examIndex];
            AppState.reviewMarks[qId] = !AppState.reviewMarks[qId];
            updateExamUI();
        };

        const calculateScore = (answers) => {
            let correct = 0, wrong = 0, blank = 0;
            QUESTION_BANK.forEach(q => {
                const ansId = answers[q.id];
                if (!ansId) blank++;
                else {
                    const isCorrect = q.opts.find(o => o.id === ansId)?.c;
                    if (isCorrect) correct++;
                    else wrong++;
                }
            });
            const score = (correct / 35) * 100;
            return { score: Number(score.toFixed(2)), stats: { correct, wrong, blank } };
        };

        const confirmSubmit = () => {
            const sess = DB.getSession(AppState.currentUser.name);
            const answeredCount = Object.keys(sess.answers || {}).length;
            const message = answeredCount < 35 
                ? `Anda baru menjawab ${answeredCount} dari 35 soal. Yakin ingin mengumpulkan sekarang?`
                : `Anda telah menjawab semua soal. Yakin ingin mengumpulkan ujian?`;
            
            showModal("Konfirmasi Pengumpulan", message, executeSubmit, "Ya, Kumpulkan", null, "Batal", "warning");
        };

        const handleAutoSubmit = () => {
            showModal("Waktu Habis", "Waktu pengerjaan telah habis. Jawaban Anda akan dikumpulkan otomatis.", executeSubmit, "OK");
            executeSubmit();
        };

        const executeSubmit = () => {
            const sess = DB.getSession(AppState.currentUser.name);
            if (!sess || sess.status === 'completed') return;

            const { score, stats } = calculateScore(sess.answers || {});
            DB.updateSession(AppState.currentUser.name, {
                status: 'completed',
                endTime: Date.now(),
                score,
                stats
            });
            
            clearInterval(AppState.timerInterval);
            navigate('student_dash');
        };

        const renderStudentDash = () => {
            const sess = DB.getSession(AppState.currentUser.name);
            if(!sess) return `<div class="p-10 text-center">Gagal memuat data.</div>`;

            const kkm = 75;
            const isPassed = sess.score >= kkm;

            return `
            <div class="min-h-screen bg-slate-100 p-4 sm:p-8 flex justify-center items-start fade-in">
                <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl overflow-hidden mt-10 border border-slate-100">
                    <div class="p-8 text-center text-white ${isPassed ? 'bg-emerald-500' : 'bg-blue-600'} relative overflow-hidden">
                        <div class="absolute top-0 right-0 opacity-20 transform translate-x-1/4 -translate-y-1/4">
                            <i data-lucide="${isPassed ? 'award' : 'check-circle'}" class="w-48 h-48"></i>
                        </div>
                        <h2 class="text-3xl font-bold mb-2 relative z-10">Ujian Selesai!</h2>
                        <p class="text-white/80 text-lg relative z-10">Terima kasih telah mengerjakan asesmen ini.</p>
                    </div>
                    
                    <div class="p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-center border-b border-slate-100 pb-6 mb-6">
                            <div>
                                <h3 class="text-2xl font-bold text-slate-800">${AppState.currentUser.name}</h3>
                                <p class="text-slate-500">${CLASS_NAME}</p>
                            </div>
                            <div class="mt-4 sm:mt-0 text-center sm:text-right">
                                <p class="text-sm text-slate-500 mb-1">Nilai Akhir</p>
                                <div class="text-5xl font-extrabold ${isPassed ? 'text-emerald-500' : 'text-blue-600'}">
                                    ${sess.score}
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4 mb-8 text-center">
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <p class="text-emerald-600 text-sm font-semibold mb-1">Benar</p>
                                <p class="text-2xl font-bold text-emerald-700">${sess.stats?.correct || 0}</p>
                            </div>
                            <div class="bg-red-50 p-4 rounded-2xl border border-red-100">
                                <p class="text-red-600 text-sm font-semibold mb-1">Salah</p>
                                <p class="text-2xl font-bold text-red-700">${sess.stats?.wrong || 0}</p>
                            </div>
                            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                                <p class="text-slate-500 text-sm font-semibold mb-1">Kosong</p>
                                <p class="text-2xl font-bold text-slate-700">${sess.stats?.blank || 0}</p>
                            </div>
                        </div>

                        <button onclick="handleLogout()" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors flex justify-center items-center gap-2">
                            <i data-lucide="log-out" class="w-5 h-5"></i> Kembali ke Beranda
                        </button>
                    </div>
                </div>
            </div>
            `;
        };

        const handleLogout = () => {
            AppState.currentUser = null;
            navigate('home');
        };

        const renderTeacherDash = () => {
            return `
            <div class="min-h-screen bg-slate-50 flex flex-col font-sans fade-in">
                <header class="bg-blue-900 text-white px-6 py-4 shadow-md flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-2 rounded-lg"><i data-lucide="users" class="w-6 h-6"></i></div>
                        <div>
                            <h1 class="font-bold text-lg">Dashboard Guru</h1>
                            <p class="text-blue-200 text-xs">${TEACHER_USER} • Asesmen ${CLASS_NAME}</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="flex items-center gap-2 bg-blue-800 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-blue-700/50">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
                    </button>
                </header>

                <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                    <!-- Ringkasan (diisi oleh JS) -->
                    <div id="teacher-summary" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

                    <!-- Kontrol & Tabel -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                        <div class="p-5 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50">
                            <div class="flex gap-3 w-full sm:w-auto">
                                <input type="text" id="t-search" placeholder="Cari nama murid..." onkeyup="filterTeacherTable()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm w-full sm:w-64 focus:ring-2 focus:ring-blue-500 outline-none" />
                                <select id="t-filter" onchange="filterTeacherTable()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm bg-white cursor-pointer outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="all">Semua Status</option>
                                    <option value="completed">Selesai</option>
                                    <option value="in_progress">Sedang Mengerjakan</option>
                                    <option value="none">Belum Mengerjakan</option>
                                </select>
                            </div>
                            <button onclick="exportExcel()" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-bold transition-colors shadow-sm">
                                <i data-lucide="download" class="w-4 h-4"></i> Ekspor Excel (.xlsx)
                            </button>
                        </div>
                        
                        <div class="flex-1 overflow-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-slate-100 sticky top-0 z-10 text-slate-600 shadow-sm">
                                    <tr>
                                        <th class="px-6 py-4 font-bold border-b">Nama Murid</th>
                                        <th class="px-6 py-4 font-bold border-b">Status</th>
                                        <th class="px-6 py-4 font-bold border-b text-center">Nilai</th>
                                        <th class="px-6 py-4 font-bold border-b text-center">B/S/K</th>
                                        <th class="px-6 py-4 font-bold border-b text-center" title="Perpindahan Tab">Pelanggaran</th>
                                    </tr>
                                </thead>
                                <tbody id="teacher-table-body" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
            `;
        };

        const attachTeacherDashListeners = () => {
            updateTeacherDashUI();
        };

        const updateTeacherDashUI = () => {
            const allSessionsRaw = DB.getSessions();
            const sessions = Object.values(allSessionsRaw);
            const completedSessions = sessions.filter(s => s.status === 'completed');
            
            const avgScore = completedSessions.length ? (completedSessions.reduce((acc, s) => acc + s.score, 0) / completedSessions.length).toFixed(2) : 0;
            const highestScore = completedSessions.length ? Math.max(...completedSessions.map(s => s.score)) : 0;
            const passedCount = completedSessions.filter(s => s.score >= 75).length;
            const passPercentage = completedSessions.length ? ((passedCount / completedSessions.length) * 100).toFixed(1) : 0;

            document.getElementById('teacher-summary').innerHTML = `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Partisipasi</p>
                    <p class="text-3xl font-extrabold text-slate-800">${completedSessions.length}<span class="text-lg text-slate-400 font-medium">/35</span></p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Rata-rata</p>
                    <p class="text-3xl font-extrabold text-blue-600">${avgScore}</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Tertinggi</p>
                    <p class="text-3xl font-extrabold text-emerald-600">${highestScore}</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Ketuntasan (KKM 75)</p>
                    <p class="text-3xl font-extrabold text-slate-800">${passPercentage}%</p>
                </div>
            `;

            filterTeacherTable();
        };

        const filterTeacherTable = () => {
            const term = document.getElementById('t-search')?.value.toLowerCase() || '';
            const statusF = document.getElementById('t-filter')?.value || 'all';
            
            const tbody = document.getElementById('teacher-table-body');
            if(!tbody) return;

            const html = STUDENTS.map((name, idx) => {
                const sess = DB.getSession(name);
                const status = sess ? sess.status : 'none';
                
                if (!name.toLowerCase().includes(term)) return '';
                if (statusF !== 'all' && status !== statusF) return '';

                let statusBadge = '<span class="px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full text-xs font-bold">Belum</span>';
                if(status === 'completed') statusBadge = '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">Selesai</span>';
                else if(status === 'in_progress') statusBadge = '<span class="px-2.5 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-bold">Mengerjakan</span>';

                let stats = '-/-/-';
                if(sess?.stats) stats = `${sess.stats.correct}/${sess.stats.wrong}/${sess.stats.blank}`;

                let cheat = '<span class="text-slate-300">-</span>';
                if(sess?.tabSwitches > 0) cheat = `<span class="flex items-center justify-center gap-1 text-red-600 font-bold bg-red-50 px-2 py-1 rounded-md text-xs"><i data-lucide="alert-triangle" class="w-3 h-3"></i> ${sess.tabSwitches}x</span>`;

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-3 font-medium text-slate-800">${idx + 1}. ${name}</td>
                        <td class="px-6 py-3">${statusBadge}</td>
                        <td class="px-6 py-3 text-center font-bold text-slate-800">${sess?.score !== undefined ? sess.score : '-'}</td>
                        <td class="px-6 py-3 text-center text-slate-500 text-xs font-mono">${stats}</td>
                        <td class="px-6 py-3 text-center">${cheat}</td>
                    </tr>
                `;
            }).filter(Boolean).join('');

            tbody.innerHTML = html || '<tr><td colspan="5" class="px-6 py-10 text-center text-slate-500">Tidak ada data ditemukan.</td></tr>';
            lucide.createIcons();
        };

        const exportExcel = () => {
            try {
                if(!window.XLSX) {
                    showModal("Gagal Ekspor", "Pustaka Excel belum termuat.", null, "Tutup", null, null, "error");
                    return;
                }

                const allSessionsRaw = DB.getSessions();
                const sessions = Object.values(allSessionsRaw);

                // Sheet 1: Rekap
                const rekapData = STUDENTS.map((name, index) => {
                    const s = allSessionsRaw[name];
                    const statusStr = !s ? "Belum Mengerjakan" : s.status === 'completed' ? "Selesai" : "Sedang Mengerjakan";
                    let durasi = "-";
                    if (s && s.startTime && s.endTime) {
                        durasi = Math.round((s.endTime - s.startTime) / 60000) + " menit";
                    }
                    return {
                        "No": index + 1,
                        "Nama Murid": name,
                        "Kelas": CLASS_NAME,
                        "Status": statusStr,
                        "Benar": s?.stats?.correct ?? "-",
                        "Salah": s?.stats?.wrong ?? "-",
                        "Kosong": s?.stats?.blank ?? "-",
                        "Nilai Akhir": s?.score ?? "-",
                        "Waktu Mulai": s?.startTime ? new Date(s.startTime).toLocaleString('id-ID') : "-",
                        "Waktu Selesai": s?.endTime ? new Date(s.endTime).toLocaleString('id-ID') : "-",
                        "Durasi": durasi
                    };
                });

                // Sheet 2: Detail
                const detailData = [];
                sessions.filter(s => s.status === 'completed').forEach(s => {
                    QUESTION_BANK.forEach(q => {
                        const ansId = s.answers?.[q.id];
                        const selectedOpt = ansId ? q.opts.find(o => o.id === ansId) : null;
                        const correctOpt = q.opts.find(o => o.c);
                        detailData.push({
                            "Nama Murid": s.name,
                            "ID Soal": q.id,
                            "Kategori": q.cat,
                            "Teks Soal": q.text,
                            "Jawaban Murid": selectedOpt ? selectedOpt.t : "(Kosong)",
                            "Kunci Jawaban": correctOpt.t,
                            "Status": selectedOpt?.c ? "Benar" : "Salah",
                            "Skor Poin": selectedOpt?.c ? Number((100/35).toFixed(2)) : 0
                        });
                    });
                });

                // Sheet 3: Aktivitas
                const activityData = sessions.map(s => ({
                    "Nama Murid": s.name,
                    "Status": s.status === 'completed' ? "Selesai" : s.status === 'in_progress' ? "Terputus/Aktif" : "Belum",
                    "Perpindahan Tab (Indikasi Curang)": s.tabSwitches || 0
                }));

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rekapData), "Rekap Nilai");
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailData), "Detail Jawaban");
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(activityData), "Aktivitas Ujian");

                XLSX.writeFile(wb, "Hasil_Asesmen_Matematika_XII-2.xlsx");
                showModal("Berhasil", "File Excel berhasil diunduh.", null, "Tutup");
            } catch (e) {
                showModal("Kesalahan", "Gagal mengekspor data: " + e.message, null, "Tutup", null, null, "error");
            }
        };

        window.onload = () => {
            navigate('home');
        };
    </script>
</body>
</html>
